<!DOCTYPE html>
<html>
<head>
<title>Crimsin Live Signals</title>

<style>

body{
    background:#121212;
    color:white;
    font-family:Arial;
    text-align:center;
    padding-top:50px;
}

.signal-box{
    width:400px;
    margin:auto;
    padding:20px;
    border-radius:15px;
    background:#1e1e1e;
    box-shadow:0px 0px 15px rgba(255,255,255,0.1);
}

h1{
    color:#00ff99;
}

#signal{
    font-size:20px;
    margin-top:20px;
}

#time{
    margin-top:15px;
    color:lightgray;
}

button{
    margin-top:20px;
    padding:10px 20px;
    cursor:pointer;
}

</style>
</head>

<body>

<div class="signal-box">

<h1>CRIMSIN LIVE SIGNALS</h1>

<div id="signal">
Loading...
</div>

<div id="time">
Waiting...
</div>

<button onclick="loadSignal()">
Refresh Now
</button>

</div>

<script>

function loadSignal(){

    fetch("http://localhost:3000/signal")
    .then(response => response.json())
    .then(data => {

        document.getElementById("signal").innerHTML =
        `
        <b>Asset:</b> ${data.asset}<br><br>
        <b>Action:</b> ${data.action}<br><br>
        <b>Confidence:</b> ${data.confidence}
        `;

        document.getElementById("time").innerHTML =
        "Updated: " + new Date().toLocaleTimeString();

    })
    .catch(error => {

        document.getElementById("signal").innerHTML =
        "Backend connection failed";

    });
}

/* Refresh every 5 seconds */
setInterval(loadSignal, 5000);

loadSignal();

</script>

</body>
</html>
