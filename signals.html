<!DOCTYPE html>
<html>
<head>
<title>Crimsin - Live Signals</title>
<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b0f14;
    color:white;
}

.header{
    background:#111827;
    padding:15px;
    display:flex;
    justify-content:space-around;
}

.header a{
    color:white;
    text-decoration:none;
}

.container{
    padding:40px;
    text-align:center;
}

.card{
    background:#111827;
    padding:20px;
    margin:20px auto;
    width:300px;
    border-radius:10px;
}

.green{ color:#00ff99; }
.red{ color:#ff4d4d; }
</style>
</head>

<body>

<div class="header">
    <a href="index.html">Home</a>
    <a href="login.html">Login</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="signals.html">Signals</a>
</div>

<div class="container">

<h1>LIVE AI SIGNALS</h1>

<div class="card">
    <h3>BTC/USD</h3>
    <p id="btc">Loading...</p>
    <p id="btcSignal"></p>
</div>

<div class="card">
    <h3>ETH/USD</h3>
    <p id="eth">Loading...</p>
    <p id="ethSignal"></p>
</div>

</div>

<script>
async function loadPrices(){

    let res = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd");
    let data = await res.json();

    let btc = data.bitcoin.usd;
    let eth = data.ethereum.usd;

    document.getElementById("btc").innerText = "$" + btc;
    document.getElementById("eth").innerText = "$" + eth;

    // SIMPLE “AI STYLE” LOGIC (NOT REAL AI)
    document.getElementById("btcSignal").innerText =
        btc % 2 === 0 ? "BUY (auto logic)" : "SELL (auto logic)";

    document.getElementById("ethSignal").innerText =
        eth % 2 === 0 ? "BUY (auto logic)" : "SELL (auto logic)";
}

// refresh every 5 seconds
loadPrices();
setInterval(loadPrices, 5000);
</script>

</body>
</html>
